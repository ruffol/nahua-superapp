<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tianguis</title>
<style>
  :root { color-scheme: light; --brand: #F2A100; --ink: #10161C; --muted: #5D6A78; --line: #E4E8F0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #F5F6FA; color: var(--ink); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 6px; }
  .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
  .ghost { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 8px; }
  main { padding: 4px 20px 130px; }
  h1 { font-size: 24px; margin: 8px 0 4px; letter-spacing: -0.4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .regions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .regions::-webkit-scrollbar { display: none; }
  .region { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .region.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .vendor { margin-top: 14px; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 14px; margin-top: 8px; display: flex; gap: 12px; align-items: center; }
  .thumb { width: 54px; height: 54px; border-radius: 16px; background: #FFF4DC; display: grid; place-items: center; font-size: 26px; flex: none; }
  .info { flex: 1; min-width: 0; }
  .info strong { display: block; font-size: 15px; }
  .info span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .price { font-weight: 800; font-size: 15px; }
  .add { border: 1px solid var(--line); background: #fff; border-radius: 12px; width: 34px; height: 34px; font-size: 18px; font-weight: 700; color: var(--brand); }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty span { min-width: 16px; text-align: center; font-weight: 700; font-size: 14px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(16,22,28,0.06); }
  .bar .line { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
  .bar strong { font-size: 20px; }
  button.primary { width: 100%; border: 0; border-radius: 16px; padding: 15px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 700; }
  button.primary:disabled { opacity: 0.45; }
  .success { text-align: center; padding: 26px 8px; }
  .success .check { width: 64px; height: 64px; border-radius: 50%; background: #E7F7F1; color: #0E7C66; display: grid; place-items: center; font-size: 30px; margin: 0 auto 14px; }
  .success h2 { margin: 0 0 6px; font-size: 22px; }
  .success p { color: var(--muted); font-size: 14px; margin: 4px 0; }
  .receipt { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin: 16px 0; }
  .receipt div { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
  .error { color: #C2410C; font-size: 13px; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> Tianguis</div>
  <button class="ghost" onclick="Nahua.close()">Cerrar</button>
</header>
<main id="app">
  <h1>Del productor colimense a tu mesa</h1>
  <p class="sub" id="sub">Elige tu municipio y arma tu mandado.</p>
  <div class="regions" id="regions"></div>
  <div id="products"></div>
  <div class="error" id="error"></div>
</main>
<div class="bar" id="bar">
  <div class="line"><span id="cartLabel">Tu canasta está vacía</span><strong id="total">$0.00</strong></div>
  <button class="primary" id="checkout" disabled>Pagar con Nahua Wallet</button>
</div>

<script src="../nahua-sdk.js"></script>
<script>
  var REGIONS = [
    { id: 'colima', label: 'Colima' },
    { id: 'villa', label: 'Villa de Álvarez' },
    { id: 'comala', label: 'Comala' },
    { id: 'tecoman', label: 'Tecomán' },
    { id: 'manzanillo', label: 'Manzanillo' },
    { id: 'armeria', label: 'Armería' }
  ];

  var PRODUCTS = [
    { id: 'ponche', region: 'colima', name: 'Ponche de granada', producer: 'Doña Chelo · Colima centro', detail: '1 L, receta de temporada', price: 85, emoji: '🍹' },
    { id: 'cocadas', region: 'colima', name: 'Cocadas colimenses', producer: 'Cocadas La Colimense', detail: '6 piezas, coco natural', price: 60, emoji: '🥥' },
    { id: 'sopes', region: 'colima', name: 'Sopes colimenses', producer: 'Cocina de la Abuela · Colima', detail: 'Orden de 4 con picadillo', price: 70, emoji: '🫓' },
    { id: 'cafe-olla', region: 'colima', name: 'Café de olla', producer: 'Café El Portal · Colima', detail: '1 L con piloncillo y canela', price: 35, emoji: '☕' },
    { id: 'tamales', region: 'villa', name: 'Tamales de elote', producer: 'Doña Mari · Villa de Álvarez', detail: 'Docena, elote tierno', price: 65, emoji: '🫔' },
    { id: 'tuba', region: 'villa', name: 'Tuba natural', producer: 'Palma Real · Villa de Álvarez', detail: '1 L, extraída del día', price: 45, emoji: '🥤' },
    { id: 'queso-villa', region: 'villa', name: 'Queso fresco', producer: 'Rancho La Capilla · Villa', detail: '500 g, leche de rancho', price: 110, emoji: '🧀' },
    { id: 'pan-elote', region: 'villa', name: 'Pan de elote', producer: 'Panadería La Villa', detail: 'Pieza grande, recién horneado', price: 50, emoji: '🍞' },
    { id: 'cafe-comala', region: 'comala', name: 'Café de Comala', producer: 'Finca El Nogal · Comala', detail: '500 g tostado medio', price: 180, emoji: '☕' },
    { id: 'pan-comala', region: 'comala', name: 'Pan de Comala', producer: 'Panadería Comalteca', detail: 'Charola de pan dulce', price: 55, emoji: '🥖' },
    { id: 'nieves', region: 'comala', name: 'Nieves de garrafa', producer: 'Nieves Don Beto · Comala', detail: '1 L, sabores de temporada', price: 40, emoji: '🍧' },
    { id: 'queso-comala', region: 'comala', name: 'Queso de Comala', producer: 'Quesería Suchitlán', detail: '500 g, madurado', price: 120, emoji: '🧀' },
    { id: 'limon', region: 'tecoman', name: 'Limón colimense', producer: 'Huerta El Limón · Tecomán', detail: '5 kg, cosecha de la semana', price: 60, emoji: '🍋' },
    { id: 'mango', region: 'tecoman', name: 'Mango ataúlfo', producer: 'Huerta San Rafael · Tecomán', detail: '3 kg, maduración natural', price: 75, emoji: '🥭' },
    { id: 'coco', region: 'tecoman', name: 'Coco fresco', producer: 'Palmar de Tecomán', detail: '3 piezas con agua', price: 35, emoji: '🥥' },
    { id: 'tamarindo', region: 'tecoman', name: 'Tamarindo', producer: 'Rancho Los Arroyos · Tecomán', detail: '500 g, pulpa natural', price: 40, emoji: '🌾' },
    { id: 'pescado', region: 'manzanillo', name: 'Pescado fresco', producer: 'Cooperativa Santiago · Manzanillo', detail: '1 kg, captura del día', price: 150, emoji: '🐟' },
    { id: 'mariscos', region: 'manzanillo', name: 'Mariscos mixtos', producer: 'Cooperativa Manzanillo', detail: '1 kg, camarón y pulpo', price: 220, emoji: '🦐' },
    { id: 'sandia', region: 'armeria', name: 'Sandía', producer: 'Ejido Armería', detail: 'Pieza de 8–10 kg', price: 50, emoji: '🍉' },
    { id: 'melon', region: 'armeria', name: 'Melón', producer: 'Ejido Armería', detail: 'Pieza de 2–3 kg', price: 45, emoji: '🍈' }
  ];

  var region = REGIONS[0];
  var cart = {};
  var paying = false;

  function money(value) { return '$' + value.toFixed(2); }

  function productsInRegion() {
    return PRODUCTS.filter(function (item) { return item.region === region.id; });
  }

  function total() {
    return Object.keys(cart).reduce(function (sum, id) {
      var product = PRODUCTS.filter(function (item) { return item.id === id; })[0];
      return sum + (product ? product.price * cart[id] : 0);
    }, 0);
  }

  function count() {
    return Object.keys(cart).reduce(function (sum, id) { return sum + cart[id]; }, 0);
  }

  function renderRegions() {
    var container = document.getElementById('regions');
    container.innerHTML = '';
    REGIONS.forEach(function (item) {
      var button = document.createElement('button');
      button.className = 'region' + (item.id === region.id ? ' active' : '');
      button.textContent = item.label;
      button.onclick = function () { region = item; render(); };
      container.appendChild(button);
    });
  }

  function renderProducts() {
    var container = document.getElementById('products');
    var html = '<div class="vendor">Productores de ' + region.label + '</div>';
    productsInRegion().forEach(function (product) {
      var quantity = cart[product.id] || 0;
      html += '<div class="card">' +
        '<div class="thumb">' + product.emoji + '</div>' +
        '<div class="info"><strong>' + product.name + '</strong><span>' + product.producer + '</span><span>' + product.detail + '</span></div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">' +
        '<span class="price">' + money(product.price) + '</span>' +
        (quantity > 0
          ? '<span class="qty"><button class="add" data-remove="' + product.id + '">−</button><span>' + quantity + '</span><button class="add" data-add="' + product.id + '">+</button></span>'
          : '<button class="add" data-add="' + product.id + '">+</button>') +
        '</div></div>';
    });
    container.innerHTML = html;

    container.querySelectorAll('[data-add]').forEach(function (button) {
      button.onclick = function () { add(button.getAttribute('data-add')); };
    });
    container.querySelectorAll('[data-remove]').forEach(function (button) {
      button.onclick = function () { remove(button.getAttribute('data-remove')); };
    });
  }

  function renderBar() {
    var items = count();
    var value = total();
    document.getElementById('total').textContent = money(value);
    document.getElementById('cartLabel').textContent = items === 0
      ? 'Tu canasta está vacía'
      : items + (items === 1 ? ' producto' : ' productos') + ' · envío local gratis';
    document.getElementById('checkout').disabled = items === 0 || paying;
  }

  function render() {
    renderRegions();
    renderProducts();
    renderBar();
    document.getElementById('error').textContent = '';
  }

  function add(id) {
    cart[id] = (cart[id] || 0) + 1;
    renderProducts();
    renderBar();
    Nahua.toast('Agregado a la canasta');
  }

  function remove(id) {
    cart[id] = (cart[id] || 0) - 1;
    if (cart[id] <= 0) delete cart[id];
    renderProducts();
    renderBar();
  }

  function showSuccess(result, amount, lines) {
    document.getElementById('bar').style.display = 'none';
    var rows = lines.map(function (line) {
      return '<div><span>' + line.name + ' × ' + line.quantity + '</span><strong>' + money(line.price * line.quantity) + '</strong></div>';
    }).join('');
    document.getElementById('app').innerHTML =
      '<div class="success">' +
      '<div class="check">✓</div>' +
      '<h2>¡Buen provecho!</h2>' +
      '<p>Tu pedido va directo del tianguis a tu casa.</p>' +
      '<div class="receipt">' + rows + '<div style="border-top:1px solid #F0F2F7;margin-top:6px;padding-top:8px"><span>Total</span><strong>' + money(amount) + '</strong></div></div>' +
      '<p style="font-size:12px;color:#9AA7B6">ID ' + result.transactionId + '</p>' +
      '<button class="primary" style="margin-top:16px" onclick="Nahua.close()">Listo</button>' +
      '</div>';
  }

  document.getElementById('checkout').onclick = function () {
    if (paying || count() === 0) return;
    var amount = total();
    var lines = Object.keys(cart).map(function (id) {
      var product = PRODUCTS.filter(function (item) { return item.id === id; })[0];
      return { name: product.name, quantity: cart[id], price: product.price };
    });
    paying = true;
    var button = document.getElementById('checkout');
    button.disabled = true;
    button.textContent = 'Confirmando…';

    Nahua.pay({
      amount: amount,
      concept: 'Mandado de ' + region.label,
      merchant: 'Tianguis Nahua'
    }).then(function (result) {
      showSuccess(result, amount, lines);
    }).catch(function (error) {
      paying = false;
      button.textContent = 'Pagar con Nahua Wallet';
      renderBar();
      var messages = {
        insufficient_funds: 'Saldo insuficiente. Recarga tu cartera.',
        cancelled: 'Pago cancelado.',
        invalid_amount: 'Monto inválido.'
      };
      document.getElementById('error').textContent = messages[error.error] || 'No pudimos completar el pago.';
    });
  };

  var user = Nahua.user();
  if (user.name) {
    document.getElementById('sub').textContent = 'Hola ' + user.name.split(' ')[0] + ' · elige tu municipio y arma tu mandado.';
  }
  render();
</script>
</body>
</html>
