name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          CMDLINE_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/* | head -n 1)"
          SDKMANAGER="$CMDLINE_TOOLS/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build versioned APK
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(echo "$VERSION" | awk -F. '{printf "%d", $1*10000 + $2*100 + $3}')"
          echo "Building $VERSION ($CODE)"
          ./gradlew --no-daemon assembleDebug \
            -PnahuaVersionName="$VERSION" \
            -PnahuaVersionCode="$CODE"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "nahua-${GITHUB_REF_NAME}.apk"
          sha256sum "nahua-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: nahua-*.apk
          name: Nahua ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
