<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mapas de Colima</title>
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
  :root {
    --ink: #3B2412;
    --paper: #EFE3CC;
    --card: rgba(58, 33, 23, 0.95);
    --card-soft: rgba(74, 42, 28, 0.92);
    --gold: #D79A45;
    --gold-soft: #E9B54F;
    --cream: #F7E9CF;
    --muted: #CBB08C;
    --line: rgba(201, 139, 75, 0.48);
    --blue: #3B5BA5;
    --red: #C46A4A;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; padding: 0; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--cream); background: var(--paper);
    -webkit-tap-highlight-color: transparent;
  }
  #map { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; background: #C6D5CB; }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  .top {
    position: fixed; z-index: 900; top: 0; left: 0; right: 0;
    padding: calc(8px + env(safe-area-inset-top)) 10px 0;
    pointer-events: none;
  }
  .card {
    background: var(--card);
    border: 1.5px solid rgba(201, 139, 75, 0.7);
    border-radius: 16px;
    box-shadow: 0 10px 26px rgba(15, 8, 5, 0.35);
    backdrop-filter: blur(10px);
    pointer-events: auto;
  }
  .head { display: flex; align-items: center; gap: 8px; padding: 9px 12px 8px; }
  .brand { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; letter-spacing: 0.2px; color: var(--cream); }
  .brand small { display: block; font-weight: 500; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .badge {
    flex: none; font-size: 9px; font-weight: 800; letter-spacing: 0.7px;
    color: #2A1508; background: var(--gold-soft); border-radius: 5px; padding: 4px 7px;
  }
  .zoomBadge {
    flex: none; font-size: 9px; font-weight: 700; color: var(--muted);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px;
  }
  .close {
    flex: none; border: 1.5px solid rgba(201, 139, 75, 0.7);
    background: #5A3524; color: var(--cream); border-radius: 7px;
    padding: 6px 10px; font-size: 11px; font-weight: 700;
  }
  .livebar {
    display: flex; align-items: center; gap: 7px;
    border-top: 1px solid var(--line); padding: 7px 12px 8px;
    font-size: 10.5px; color: var(--muted);
  }
  .livebar strong { color: var(--cream); font-weight: 600; }
  .livebar .liveHeading { color: var(--gold-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
  .livebar .liveCoords { margin-left: auto; color: var(--gold-soft); font-variant-numeric: tabular-nums; }
  .liveDot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--muted); box-shadow: 0 0 0 3px rgba(203, 176, 140, 0.15);
  }
  .liveDot.live { background: #8FC47A; box-shadow: 0 0 0 3px rgba(143, 196, 122, 0.22); animation: livePulse 1.8s infinite; }
  .liveDot.search { background: var(--gold); animation: livePulse 1.2s infinite; }
  .liveDot.error { background: var(--red); }
  @keyframes livePulse {
    0% { opacity: 1; }
    50% { opacity: 0.35; }
    100% { opacity: 1; }
  }

  .under {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 6px;
    margin-top: 6px;
  }
  .fogChip {
    display: flex; align-items: center; gap: 6px;
    margin-top: 0; padding: 5px 10px;
    border-radius: 9px; background: var(--card-soft);
    border: 1.5px solid var(--line);
    font-size: 10px; font-weight: 600; color: var(--muted);
    box-shadow: 0 6px 16px rgba(15, 8, 5, 0.3);
    pointer-events: none;
  }
  .fogChip .fogGlyph { font-size: 12px; }

  /* Brújula pequeña: el arriba del dial es hacia dónde miras (tu pantalla), y la rosa gira
     con el rumbo para que la N siempre señale el norte del mapa. */
  .compass {
    flex: none; margin-left: auto;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    pointer-events: none;
  }
  .dial {
    position: relative; width: 56px; height: 56px; border-radius: 50%;
    background: var(--card); border: 1.5px solid rgba(201, 139, 75, 0.7);
    box-shadow: 0 6px 16px rgba(15, 8, 5, 0.3);
  }
  .rose { position: absolute; inset: 0; transition: transform 0.14s linear; }
  .compass .cardinal {
    position: absolute; z-index: 2; font-size: 8px; font-weight: 800; letter-spacing: 0.4px;
    color: var(--muted); text-shadow: 0 0 3px rgba(58, 33, 23, 0.95);
  }
  .compass .cardinal.n { top: 1px; left: 50%; transform: translateX(-50%); color: var(--gold-soft); }
  .compass .cardinal.e { right: 4px; top: 50%; transform: translateY(-50%); }
  .compass .cardinal.s { bottom: 2px; left: 50%; transform: translateX(-50%); }
  .compass .cardinal.o { left: 4px; top: 50%; transform: translateY(-50%); }
  .compass .needle {
    position: absolute; z-index: 1; left: 50%; top: 50%; width: 2px; height: 16px;
    margin: -16px 0 0 -1px; border-radius: 1px;
    background: linear-gradient(180deg, var(--red) 0%, var(--red) 70%, rgba(196, 106, 74, 0.1) 100%);
  }
  .compass .needle::after {
    content: ''; position: absolute; left: -3px; top: -4px;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 5px solid var(--red);
  }
  .compass .eyeMark {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 11px; line-height: 1;
  }
  .compass .indexMark {
    position: absolute; left: 50%; top: -3px; transform: translateX(-50%);
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid var(--gold-soft);
  }
  .compassRead {
    display: flex; gap: 4px; align-items: baseline;
    font-size: 9px; font-weight: 700; color: var(--gold-soft);
    font-variant-numeric: tabular-nums;
  }
  .compassRead .dir { color: var(--cream); }

  .controls {
    position: fixed; z-index: 820; right: 9px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 7px;
  }
  .ctl {
    width: 42px; height: 42px; border-radius: 8px;
    border: 1.5px solid rgba(201, 139, 75, 0.7);
    background: var(--card); color: var(--cream);
    font-size: 20px; font-weight: 700; line-height: 1;
    display: grid; place-items: center;
    box-shadow: 0 5px 14px rgba(15, 8, 5, 0.3);
  }
  .ctl:active { transform: scale(0.94); }
  .ctl.locate { background: var(--gold); color: #2A1508; border-color: #E9B54F; font-size: 18px; }
  .ctl.locate.active { background: var(--blue); color: #F4F7FF; border-color: #6E86C9; }
  .ctl.fog { font-size: 19px; }
  .ctl.fog.active { background: rgba(59, 91, 165, 0.55); border-color: #6E86C9; color: #F4F7FF; }
  .ctl.fog.arm { background: var(--red); border-color: #E0906F; color: #FFF7E8; }

  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution {
    font-size: 8px; background: rgba(58, 33, 23, 0.82); color: #E9D6B4;
    padding: 2px 5px; border-radius: 4px 0 0 0;
  }
  .leaflet-control-attribution a { color: var(--gold-soft); }
  .leaflet-bottom.leaflet-right { bottom: 2px; }
  .leaflet-bottom.leaflet-left { bottom: 2px; }
  .leaflet-control-scale-line {
    background: rgba(58, 33, 23, 0.7); border-color: rgba(247, 233, 207, 0.6);
    color: var(--cream); font-size: 9px;
  }

  /* El ojo marca la posición; el cono gira con la brújula del teléfono. */
  .user-wrap { position: relative; width: 44px; height: 44px; }
  .look-cone {
    position: absolute; left: 50%; top: 50%; width: 168px; height: 168px;
    margin: -84px 0 0 -84px; border-radius: 50%;
    background: conic-gradient(
      from -26deg,
      rgba(59, 91, 165, 0) 0deg,
      rgba(59, 91, 165, 0.62) 26deg,
      rgba(59, 91, 165, 0) 52deg
    );
    -webkit-mask-image: radial-gradient(closest-side, rgba(0, 0, 0, 0) 6%, rgba(0, 0, 0, 0.95) 22%, rgba(0, 0, 0, 0.72) 64%, rgba(0, 0, 0, 0) 100%);
    mask-image: radial-gradient(closest-side, rgba(0, 0, 0, 0) 6%, rgba(0, 0, 0, 0.95) 22%, rgba(0, 0, 0, 0.72) 64%, rgba(0, 0, 0, 0) 100%);
    transform: rotate(0deg); transform-origin: 50% 50%;
    transition: transform 0.2s linear;
    pointer-events: none;
    display: none;
  }
  .user-pulse {
    position: absolute; inset: 3px; border-radius: 50%;
    background: rgba(59, 91, 165, 0.22); animation: userPulse 2.2s infinite;
  }
  .user-eye {
    position: absolute; inset: 7px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--blue); border: 2.5px solid #FFF7E8;
    box-shadow: 0 2px 8px rgba(15, 8, 5, 0.45);
    font-size: 15px; line-height: 1;
  }
  .user-eye span { transform: translateY(0.5px); }
  @keyframes userPulse {
    0% { transform: scale(0.55); opacity: 0.9; }
    70% { transform: scale(1.55); opacity: 0; }
    100% { opacity: 0; }
  }

  body.compact-mode .zoomBadge,
  body.compact-mode .close,
  body.compact-mode .brand small { display: none !important; }
  body.compact-mode .livebar { font-size: 9.5px; padding: 5px 9px 6px; gap: 5px; }
  body.compact-mode .livebar .liveCoords { font-size: 9.5px; }
  body.compact-mode .livebar strong { max-width: 52%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.compact-mode .top { padding-top: 6px; }
  body.compact-mode .card { background: rgba(58, 33, 23, 0.93); border-radius: 12px; }
  body.compact-mode .head { padding: 6px 9px 5px; }
  body.compact-mode .brand { font-size: 12px; }
  body.compact-mode .badge { font-size: 8px; padding: 3px 5px; }
  body.compact-mode .fogChip { margin-top: 5px; padding: 4px 8px; font-size: 9px; border-radius: 8px; }
  body.compact-mode .controls { bottom: 12px; right: 8px; gap: 6px; }
  body.compact-mode .ctl { width: 40px; height: 40px; }
  body.compact-mode .ctl.locate { width: 44px; height: 44px; font-size: 19px; }
  body.compact-mode .leaflet-bottom.leaflet-left { display: none; }
  body.compact-mode .leaflet-bottom.leaflet-right { bottom: 2px; }
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="card">
    <div class="head">
      <div class="brand">Colima<small id="cityLabel">Mapa offline · GPS y coordenadas</small></div>
      <span class="badge">OFFLINE</span>
      <span class="zoomBadge" id="zoomLevel">z13</span>
      <button class="close" onclick="Nahua.close()">Cerrar</button>
    </div>
    <div class="livebar" id="livebar">
      <span class="liveDot" id="liveDot"></span>
      <strong id="liveText">Toca ◎ para GPS en vivo</strong>
      <span class="liveHeading hidden" id="liveHeading"></span>
      <span class="liveCoords" id="liveCoords"></span>
    </div>
  </div>
  <div class="under">
    <div class="fogChip hidden" id="fogChip">
      <span class="fogGlyph">🌫</span>
      <span id="fogText">Neblina activa</span>
    </div>

    <div class="compass hidden" id="compass">
      <div class="dial">
        <div class="rose" id="rose">
          <span class="cardinal n">N</span>
          <span class="cardinal e">E</span>
          <span class="cardinal s">S</span>
          <span class="cardinal o">O</span>
          <span class="needle"></span>
        </div>
        <span class="eyeMark">👁</span>
        <span class="indexMark"></span>
      </div>
      <div class="compassRead"><span class="dir" id="compassCard">—</span><span id="compassDeg">0°</span></div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="ctl fog" id="fogBtn" aria-label="Neblina de exploración">🌫</button>
  <button class="ctl locate" id="locate" aria-label="Centrar en mi ubicación">◎</button>
</div>

<script src="../vendor/leaflet/leaflet.js"></script>
<script src="../nahua-sdk.js"></script>
<script>
(function () {
  'use strict';

  var isCompact = window.location.search.indexOf('mode=compact') !== -1;
  if (isCompact) document.body.classList.add('compact-mode');

  var TRANSPARENT = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  var BOUNDS = L.latLngBounds([18.40, -105.05], [19.65, -103.15]);
  var STATE_BOUNDS = L.latLngBounds([18.42, -104.98], [19.62, -103.20]);
  var COLIMA_CENTER = [19.2433, -103.7250];

  // La neblina sólo se despeja con lecturas que el GPS puede sostener. El radio de 12 m cubre
  // la incertidumbre aceptada (8 m), así que el punto real cae dentro del despeje; con 4.2 m
  // no era así: una lectura de ±8 m podía despejar un sitio equivocado.
  var REVEAL_RADIUS_M = 12;
  var REVEAL_MAX_ACCURACY_M = 8;
  var REVEAL_MAX_FIX_AGE_MS = 12000;
  var REVEAL_MAX_SPEED_MPS = 30;

  var map = L.map('map', {
    zoomControl: false,
    minZoom: 9,
    maxZoom: 17,
    maxBounds: BOUNDS,
    maxBoundsViscosity: 0.9,
    preferCanvas: true
  }).setView(COLIMA_CENTER, 13);

  if (!isCompact) {
    // Vista inicial: todo el estado, ya descargado en z9–13.
    map.fitBounds(STATE_BOUNDS, { padding: [4, 4] });
  }

  map.attributionControl.setPrefix(false);

  var base = L.tileLayer('tiles/{z}/{x}/{y}.png', {
    minZoom: 9, maxZoom: 17, maxNativeZoom: 13,
    keepBuffer: 3, updateWhenIdle: false, updateWhenZooming: false,
    errorTileUrl: TRANSPARENT,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Una sola capa estatal: usa z14-z16 nativos donde hay manzanas INEGI y deja
  // transparente el resto para que se vea la capa base z13.
  var detail = L.tileLayer('tiles/{z}/{x}/{y}.webp', {
    minZoom: 14, maxZoom: 17, maxNativeZoom: 16,
    bounds: STATE_BOUNDS,
    keepBuffer: 4, updateWhenIdle: true, updateWhenZooming: false,
    errorTileUrl: TRANSPARENT
  }).addTo(map);

  L.control.scale({ imperial: false, position: 'bottomleft', maxWidth: 90 }).addTo(map);

  var userMarker = null;
  var userCircle = null;
  var state = {
    fix: null,
    stopWatch: null,
    stopError: null,
    stopHeading: null,
    stopHeadingError: null,
    heading: null,
    headingRaw: null,
    headingContinuous: 0,
    searchTimer: null,
    ageTimer: null,
    manualStop: false,
    blocked: false,
    everTracked: false,
    headingWarned: false,
    follow: false
  };

  function el(id) { return document.getElementById(id); }

  function haversine(a, b) {
    var R = 6371000;
    var dLat = (b.lat - a.lat) * Math.PI / 180;
    var dLng = (b.lng - a.lng) * Math.PI / 180;
    var la1 = a.lat * Math.PI / 180;
    var la2 = b.lat * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function cardinal(deg) {
    var names = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
    return names[Math.round(deg / 45) % 8];
  }

  function detailZoom(lat, lng) {
    return (lat >= 19.18 && lat <= 19.39 && lng >= -103.82 && lng <= -103.62) ? 16 : 14;
  }

  // ---------- ubicación ----------

  function setStatus(kind, text) {
    el('liveDot').className = 'liveDot ' + kind;
    el('liveText').textContent = text;
  }

  function updateUserMarker(fix) {
    var latlng = [fix.lat, fix.lng];
    if (!userMarker) {
      userMarker = L.marker(latlng, {
        icon: L.divIcon({
          className: '',
          html: '<div class="user-wrap"><div class="look-cone"></div>' +
            '<div class="user-pulse"></div><div class="user-eye"><span>👁</span></div></div>',
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        }),
        interactive: false,
        zIndexOffset: 1000
      }).addTo(map);
    } else {
      userMarker.setLatLng(latlng);
    }
    if (!userCircle) {
      userCircle = L.circle(latlng, {
        radius: Math.max(8, fix.accuracy || 20),
        color: '#3B5BA5', weight: 1.5, fillColor: '#3B5BA5', fillOpacity: 0.12,
        interactive: false
      }).addTo(map);
    } else {
      userCircle.setLatLng(latlng);
      userCircle.setRadius(Math.max(8, fix.accuracy || 20));
    }
    updateHeadingUi();
  }

  function updateGpsUi(fix) {
    el('livebar').classList.remove('hidden');
    el('liveCoords').textContent = fix.lat.toFixed(5) + ', ' + fix.lng.toFixed(5);
    var acc = Math.round(fix.accuracy || 0);
    var text = 'GPS en vivo · ±' + acc + ' m';
    if (fix.speed != null && fix.speed > 0.3) {
      text += ' · ' + Math.round(fix.speed * 3.6) + ' km/h';
    }
    setStatus('live', text);
  }

  function updateAge() {
    if (!state.fix) return;
    var age = Math.max(0, Math.round((Date.now() - state.fix.receivedAt) / 1000));
    if (state.stopWatch && age > 25) {
      setStatus('search', 'Señal débil · última hace ' + age + ' s');
    }
  }

  function applyFix(raw, fly) {
    if (!raw || raw.lat == null || raw.lng == null) return;
    var now = Date.now();
    var fix = {
      lat: Number(raw.lat),
      lng: Number(raw.lng),
      accuracy: Number(raw.accuracy) || 0,
      speed: raw.speed == null ? null : Number(raw.speed),
      altitude: raw.altitude == null ? null : Number(raw.altitude),
      timestamp: Number(raw.timestamp) || now,
      provider: raw.provider || null,
      receivedAt: now
    };
    if (state.fix) {
      var dt = (fix.timestamp - state.fix.timestamp) / 1000;
      var moved = haversine(state.fix, fix);
      if (fix.speed == null && dt > 0 && moved > 0.5) {
        fix.speed = Math.min(60, moved / dt);
      }
    }
    var first = !state.fix;
    state.fix = fix;
    updateUserMarker(fix);
    updateGpsUi(fix);
    revealFromFix(fix);
    if (!state.stopHeading) startHeading();
    if (first && fly) {
      var target = detailZoom(fix.lat, fix.lng);
      if (fix.accuracy > 80) target = Math.min(15, target);
      map.flyTo([fix.lat, fix.lng], target, { duration: 0.9 });
    } else if (state.follow && FOG.on) {
      // Caminar con la neblina encendida: el mapa acompaña al ojo. Si el usuario arrastra el
      // mapa, el seguimiento se suelta hasta que vuelva a tocar ◎.
      var punto = map.latLngToContainerPoint([fix.lat, fix.lng]);
      var centro = map.getSize().divideBy(2);
      if (punto.distanceTo(centro) > 24) {
        map.panTo([fix.lat, fix.lng], { animate: true, duration: 0.45, easeLinearity: 0.25 });
      }
    }
  }

  function onLocationError(error) {
    clearTimeout(state.searchTimer);
    if (error && error.error === 'permission_denied') {
      state.blocked = true;
      setStatus('error', 'Permiso de ubicación denegado');
    } else {
      setStatus('error', 'GPS no disponible');
    }
    if (state.stopWatch) {
      try { state.stopWatch(); } catch (ignore) {}
    }
    state.stopWatch = null;
    if (state.stopError) {
      try { state.stopError(); } catch (ignore) {}
    }
    state.stopError = null;
    el('locate').classList.remove('active');
  }

  function startTracking() {
    state.manualStop = false;
    state.everTracked = true;
    if (state.stopWatch) return;
    setStatus('search', 'Buscando señal GPS…');
    try {
      state.stopWatch = Nahua.watchLocation(function (fix) { applyFix(fix, true); }, {
        intervalMs: isCompact ? 2000 : 1500
      });
    } catch (error) {
      setStatus('error', 'GPS no disponible');
      return;
    }
    if (Nahua.onLocationError) {
      state.stopError = Nahua.onLocationError(onLocationError);
    }
    startHeading();
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(function () {
      if (!state.fix) setStatus('search', 'Buscando GPS… sal al aire libre');
    }, 14000);
    el('locate').classList.add('active');
  }

  function stopTracking(manual) {
    if (state.stopWatch) {
      try { state.stopWatch(); } catch (ignore) {}
    }
    state.stopWatch = null;
    if (state.stopError) {
      try { state.stopError(); } catch (ignore) {}
    }
    state.stopError = null;
    clearTimeout(state.searchTimer);
    state.searchTimer = null;
    if (manual) state.manualStop = true;
    el('locate').classList.remove('active');
  }

  // ---------- brújula: hacia dónde mira el teléfono ----------

  /**
   * El cono del ojo apunta hacia donde se mira. La brújula la calcula el anfitrión con el
   * sensor de rotación (el top del teléfono va inclinado hacia adelante al sostenerlo); aquí
   * sólo se suaviza la vuelta de 359° a 0° para que el cono no gire al revés.
   */
  function applyHeading(deg) {
    if (deg == null || !isFinite(deg)) return;
    var raw = ((Number(deg) % 360) + 360) % 360;
    if (state.headingRaw == null) {
      state.headingContinuous = raw;
    } else {
      var delta = raw - state.headingRaw;
      if (delta > 180) delta -= 360;
      else if (delta < -180) delta += 360;
      state.headingContinuous += delta;
    }
    state.headingRaw = raw;
    state.heading = raw;
    updateHeadingUi();
  }

  function updateHeadingUi() {
    var element = userMarker ? userMarker.getElement() : null;
    var cone = element ? element.querySelector('.look-cone') : null;
    var label = el('liveHeading');
    if (state.heading == null) {
      if (cone) cone.style.display = 'none';
      label.classList.add('hidden');
      updateCompassUi();
      return;
    }
    if (cone) {
      cone.style.display = 'block';
      cone.style.transform = 'rotate(' + state.headingContinuous.toFixed(1) + 'deg)';
    }
    label.textContent = '👁 ' + cardinal(state.heading) + ' ' + degreesLabel();
    label.classList.remove('hidden');
    updateCompassUi();
  }

  /** Redondeo del rumbo sin imprimir 360°: el norte es 0°, también a 359.7°. */
  function degreesLabel() {
    return (Math.round(state.heading) % 360) + '°';
  }

  /**
   * Brújula pequeña: el arriba del dial es tu mirada —el borde superior de la pantalla, que es lo
   * que el anfitrión mide— y la rosa gira con el rumbo para que la N siga señalando el norte del
   * mapa. El ojo marca el centro y la muesca dorada, tu mirada.
   */
  function updateCompassUi() {
    var compass = el('compass');
    if (state.heading == null) {
      compass.classList.add('hidden');
      return;
    }
    compass.classList.remove('hidden');
    el('rose').style.transform = 'rotate(' + (-state.headingContinuous).toFixed(1) + 'deg)';
    el('compassCard').textContent = cardinal(state.heading);
    el('compassDeg').textContent = degreesLabel();
  }

  function startHeading() {
    if (state.stopHeading || !Nahua.watchHeading) return;
    try {
      state.stopHeading = Nahua.watchHeading(function (data) {
        if (data && data.heading != null) applyHeading(data.heading);
      });
      if (Nahua.onHeadingError) {
        state.stopHeadingError = Nahua.onHeadingError(function (error) {
          if (state.headingWarned) return;
          state.headingWarned = true;
          if (error && error.error === 'unsupported') {
            setStatus('live', 'Sin brújula · no se puede saber hacia dónde miras');
          }
        });
      }
    } catch (error) {
      state.stopHeading = null;
    }
  }

  function stopHeading() {
    if (state.stopHeading) {
      try { state.stopHeading(); } catch (ignore) {}
    }
    state.stopHeading = null;
    if (state.stopHeadingError) {
      try { state.stopHeadingError(); } catch (ignore) {}
    }
    state.stopHeadingError = null;
    state.heading = null;
    state.headingRaw = null;
    updateHeadingUi();
  }

  // ---------- neblina de exploración ----------

  var FOG = {
    on: false,
    cells: Object.create(null),   // clave de celda -> [lat, lng] validados
    keys: [],
    layer: null,
    redrawTimer: null,
    saveTimer: null,
    pointCache: Object.create(null),
    lastReveal: null,
    armAt: 0,
    storageKey: 'nahua.mapa.neblina.v3',
    cellDeg: 0.00004,             // ~4.45 m de norte a sur
    maxCells: 8000,
    // Niebla translúcida: la silueta del terreno se intuye, pero sólo lo caminado se lee
    // nítido. Con 0.965 el despeje quedaba invisible a zoom de detalle.
    fill: 'rgba(28, 16, 10, 0.9)'
  };

  function cellKey(lat, lng) {
    return Math.round(lat / FOG.cellDeg) + ',' + Math.round(lng / FOG.cellDeg);
  }

  function fogArea() {
    // Cada celda cubre ~4.45 m × 4.7 m: se informa como aproximado, no como medición.
    return FOG.keys.length * 20;
  }

  function updateFogUi() {
    var text = FOG.keys.length
      ? 'Neblina activa · ' + FOG.keys.length + ' puntos · ≈' +
        Math.round(fogArea() / 10) * 10 + ' m²'
      : 'Neblina activa · camina para despejar ' + REVEAL_RADIUS_M + ' m a la redonda';
    if (FOG.armAt) text = 'Toca otra vez para borrar el recorrido';
    el('fogText').textContent = text;
    el('fogChip').classList.toggle('hidden', !FOG.on);
    el('fogBtn').classList.toggle('active', !!(FOG.on && !FOG.armAt));
    el('fogBtn').classList.toggle('arm', !!(FOG.on && FOG.armAt));
  }

  function saveFog() {
    clearTimeout(FOG.saveTimer);
    FOG.saveTimer = null;
    try {
      var chunks = [];
      for (var i = 0; i < FOG.keys.length; i++) {
        var cell = FOG.cells[FOG.keys[i]];
        if (!cell) continue;
        chunks.push(cell[0].toFixed(5) + ',' + cell[1].toFixed(5));
      }
      localStorage.setItem(FOG.storageKey, chunks.join(';'));
    } catch (error) {
      // Sin almacenamiento el recorrido dura lo que la sesión; el mapa sigue funcionando.
    }
  }

  function saveFogSoon() {
    if (FOG.saveTimer) return;
    FOG.saveTimer = setTimeout(saveFog, 2500);
  }

  function loadFog() {
    var raw = null;
    try { raw = localStorage.getItem(FOG.storageKey); } catch (error) { return; }
    if (!raw) return;
    raw.split(';').forEach(function (chunk) {
      var parts = chunk.split(',');
      if (parts.length !== 2) return;
      var lat = parseFloat(parts[0]);
      var lng = parseFloat(parts[1]);
      if (!isFinite(lat) || !isFinite(lng)) return;
      addCell(lat, lng, true);
    });
  }

  function addCell(lat, lng, silent) {
    var key = cellKey(lat, lng);
    if (FOG.cells[key]) return false;
    FOG.cells[key] = [lat, lng];
    FOG.keys.push(key);
    if (FOG.keys.length > FOG.maxCells) {
      FOG.keys.splice(0, 500).forEach(function (old) { delete FOG.cells[old]; });
    }
    FOG.pointCache = Object.create(null);
    if (!silent) scheduleFogRedraw();
    return true;
  }

  function clearExploration() {
    FOG.cells = Object.create(null);
    FOG.keys = [];
    FOG.pointCache = Object.create(null);
    FOG.lastReveal = null;
    FOG.armAt = 0;
    saveFog();
    if (FOG.layer && FOG.on) FOG.layer.redraw();
    updateFogUi();
  }

  function scheduleFogRedraw() {
    if (!FOG.on || FOG.redrawTimer) return;
    FOG.redrawTimer = setTimeout(function () {
      FOG.redrawTimer = null;
      if (FOG.on && FOG.layer) FOG.layer.redraw();
      saveFogSoon();
    }, 300);
  }

  /**
   * Despeja la neblina sólo cuando la lectura es defendible: reciente, con precisión mejor
   * que 8 m y sin saltos imposibles. Una lectura dudosa re-ancla el GPS pero no despeja
   * nada, y la siguiente debe volver a coincidir para confirmar.
   */
  function revealFromFix(fix) {
    if (!FOG.on || !fix) return;
    var age = Date.now() - Number(fix.timestamp || 0);
    if (!(age >= 0 && age <= REVEAL_MAX_FIX_AGE_MS)) return;
    var accuracy = Number(fix.accuracy);
    if (!(accuracy > 0) || accuracy > REVEAL_MAX_ACCURACY_M) return;

    var last = FOG.lastReveal;
    if (last) {
      var dt = (Number(fix.timestamp) - Number(last.timestamp)) / 1000;
      var moved = haversine(last, fix);
      if (dt >= 0 && moved / Math.max(dt, 0.5) > REVEAL_MAX_SPEED_MPS) {
        // Salto imposible: no se despeja nada hasta que tres lecturas seguidas coincidan
        // en el mismo sitio nuevo. Así un pico de GPS no abre el mapa a 800 m de aquí.
        var pending = FOG.pending;
        var tolerance = Math.max(15, accuracy * 3);
        if (pending && haversine(pending, fix) <= tolerance) {
          pending.count += 1;
          pending.lat = fix.lat;
          pending.lng = fix.lng;
          pending.timestamp = fix.timestamp;
          if (pending.count < 3) {
            if (FOG.keys.length === 0) {
              el('fogText').textContent = 'GPS inestable · confirmando posición';
            }
            return;
          }
          FOG.lastReveal = { lat: fix.lat, lng: fix.lng, timestamp: fix.timestamp };
        } else {
          FOG.pending = { lat: fix.lat, lng: fix.lng, timestamp: fix.timestamp, count: 1 };
          if (FOG.keys.length === 0) {
            el('fogText').textContent = 'GPS inestable · confirmando posición';
          }
          return;
        }
      }
    }

    FOG.pending = null;
    FOG.lastReveal = { lat: fix.lat, lng: fix.lng, timestamp: fix.timestamp };
    if (addCell(fix.lat, fix.lng)) {
      updateFogUi();
      Nahua.haptic('tap');
    }
  }

  function metersPerPixel(lat, zoom) {
    return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
  }

  function fogPointsForZoom(zoom) {
    if (FOG.pointCache[zoom]) return FOG.pointCache[zoom];
    var points = [];
    for (var i = 0; i < FOG.keys.length; i++) {
      var cell = FOG.cells[FOG.keys[i]];
      if (!cell) continue;
      points.push(map.project(L.latLng(cell[0], cell[1]), zoom));
    }
    FOG.pointCache[zoom] = points;
    return points;
  }

  function paintFogTile(tile, coords, size) {
    var ctx = tile.getContext('2d');
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, size.x, size.y);
    ctx.fillStyle = FOG.fill;
    ctx.fillRect(0, 0, size.x, size.y);

    var originX = coords.x * size.x;
    var originY = coords.y * size.y;
    var mpp = metersPerPixel(map.unproject([originX, originY], coords.z).lat, coords.z);
    var radius = REVEAL_RADIUS_M / mpp;
    // Con menos de ~1.2 px la brecha no se vería: a ese zoom la neblina queda cerrada.
    if (radius < 1.2) return;

    var glow = radius * 1.18;
    var points = fogPointsForZoom(coords.z);
    ctx.globalCompositeOperation = 'destination-out';
    for (var i = 0; i < points.length; i++) {
      var x = points[i].x - originX;
      var y = points[i].y - originY;
      if (x < -glow || y < -glow || x > size.x + glow || y > size.y + glow) continue;
      var gradient = ctx.createRadialGradient(x, y, 0, x, y, glow);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 1)');
      gradient.addColorStop(0.82, 'rgba(0, 0, 0, 0.95)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, glow, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // Una capa de teselas: Leaflet se encarga del paneo y del zoom, y sólo se repintan las
  // visibles cuando se despeja un punto nuevo.
  var FogLayer = L.GridLayer.extend({
    createTile: function (coords) {
      var tile = L.DomUtil.create('canvas', 'leaflet-tile');
      var size = this.getTileSize();
      tile.width = size.x;
      tile.height = size.y;
      paintFogTile(tile, coords, size);
      return tile;
    }
  });

  function setFog(on) {
    FOG.on = !!on;
    FOG.armAt = 0;
    if (FOG.on) {
      if (!FOG.layer) {
        FOG.layer = new FogLayer({
          minZoom: 9, maxZoom: 17, keepBuffer: 2, updateWhenIdle: false, noWrap: true
        });
      }
      FOG.layer.addTo(map);
      if (!state.stopWatch) startTracking();
      if (state.fix) revealFromFix(state.fix);
      // El despeje se lee con el detalle urbano delante, así que al encender la neblina el mapa
      // se acerca al punto donde estás.
      if (state.fix && map.getZoom() < 17) {
        map.flyTo([state.fix.lat, state.fix.lng], 17, { duration: 0.8 });
      }
      state.follow = true;
      updateFogUi();
      Nahua.haptic('confirm');
      Nahua.toast('Neblina activa · caminar despeja ' + REVEAL_RADIUS_M + ' m a la redonda');
    } else {
      if (FOG.layer && map.hasLayer(FOG.layer)) map.removeLayer(FOG.layer);
      FOG.lastReveal = null;
      saveFog();
      updateFogUi();
      Nahua.toast('Neblina apagada · tu recorrido queda guardado');
    }
  }

  function armFogReset() {
    if (!FOG.on) return;
    FOG.armAt = Date.now();
    updateFogUi();
    Nahua.haptic('long');
    setTimeout(function () {
      if (FOG.armAt && Date.now() - FOG.armAt >= 4900) {
        FOG.armAt = 0;
        updateFogUi();
      }
    }, 5000);
  }

  // ---------- eventos ----------

  el('locate').onclick = function () {
    Nahua.haptic('tap');
    state.follow = true;
    if (state.stopWatch && state.fix) {
      var target = Math.max(16, detailZoom(state.fix.lat, state.fix.lng));
      map.flyTo([state.fix.lat, state.fix.lng], target, { duration: 0.6 });
      return;
    }
    state.manualStop = false;
    state.blocked = false;
    startTracking();
  };

  el('livebar').onclick = function () {
    if (!state.fix) {
      Nahua.toast('Todavía no hay una posición');
      return;
    }
    var text = state.fix.lat.toFixed(6) + ', ' + state.fix.lng.toFixed(6);
    Nahua.copy(text).then(function () {
      Nahua.toast('Coordenadas copiadas');
    }).catch(function () {
      Nahua.toast(text);
    });
  };

  var fogHold = null;
  var fogSuppressClick = false;

  el('fogBtn').addEventListener('pointerdown', function () {
    if (!FOG.on) return;
    clearTimeout(fogHold);
    fogHold = setTimeout(function () {
      fogHold = null;
      fogSuppressClick = true;
      armFogReset();
    }, 650);
  });

  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (name) {
    el('fogBtn').addEventListener(name, function () {
      clearTimeout(fogHold);
      fogHold = null;
    });
  });

  el('fogBtn').onclick = function () {
    if (fogSuppressClick) {
      fogSuppressClick = false;
      return;
    }
    if (FOG.armAt) {
      clearExploration();
      Nahua.toast('Recorrido de la neblina borrado');
      return;
    }
    setFog(!FOG.on);
  };

  map.on('zoomend', function () {
    el('zoomLevel').textContent = 'z' + map.getZoom();
  });

  // Si el usuario arrastra el mapa, deja de seguir el GPS: el mapa no debe pelearse con el dedo.
  map.on('dragstart', function () {
    state.follow = false;
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stopTracking(false);
      stopHeading();
      saveFog();
      return;
    }
    if (!state.manualStop && !state.blocked && state.everTracked) startTracking();
    if (state.fix) startHeading();
    triggerResize();
  });

  /**
   * El WebView del inicio cambia de tamaño al abrir y cerrar el mapa a pantalla completa;
   * sin este aviso Leaflet cree que sigue midiendo lo mismo y los toques caen donde no es.
   */
  function triggerResize() {
    map.invalidateSize(false);
    setTimeout(function () { map.invalidateSize(false); }, 120);
    setTimeout(function () { map.invalidateSize(false); }, 380);
  }

  window.addEventListener('resize', triggerResize);
  window.addEventListener('focus', triggerResize);
  window.addEventListener('pageshow', triggerResize);
  window.triggerResize = triggerResize;

  window.locateUser = startTracking;

  // Ganchos de QA y del anfitrión: permiten probar la neblina sin salir a caminar.
  window.NahuaMap = {
    fix: function (lat, lng, accuracy, options) {
      var extra = options || {};
      applyFix({
        lat: Number(lat), lng: Number(lng),
        accuracy: accuracy == null ? 5 : Number(accuracy),
        timestamp: extra.timestamp == null ? Date.now() : Number(extra.timestamp),
        provider: extra.provider || 'gps'
      }, !!extra.fly);
    },
    heading: applyHeading,
    fog: function (on) { setFog(on); },
    reset: function () { clearExploration(); },
    explored: function () { return FOG.keys.length; },
    area: fogArea,
    enabled: function () { return FOG.on; },
    radiusMeters: function () { return REVEAL_RADIUS_M; },
    reveal: function (lat, lng) {
      revealFromFix({
        lat: Number(lat), lng: Number(lng), accuracy: 5,
        timestamp: Date.now(), provider: 'gps'
      });
    }
  };

  // ---------- arranque ----------

  loadFog();
  updateFogUi();
  el('cityLabel').textContent = 'Colima · © OSM · INEGI';
  el('zoomLevel').textContent = 'z' + map.getZoom();

  state.ageTimer = setInterval(updateAge, 1000);

  setTimeout(triggerResize, 100);
  setTimeout(triggerResize, 500);

  if (!isCompact) {
    setTimeout(startTracking, 700);
  }
})();
</script>
</body>
</html>
