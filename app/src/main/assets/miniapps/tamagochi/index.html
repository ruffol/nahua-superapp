<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Axolote</title>
<style>
  :root { color-scheme: light; --brand: #FF6B4A; --pink: #FFB3C7; --ink: #10161C; --muted: #5D6A78; --line: #E4E8F0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #F5F6FA; color: var(--ink); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 6px; }
  .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
  .ghost { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 8px; }
  main { padding: 4px 20px 28px; }
  .stage { position: relative; border-radius: 28px; padding: 18px 18px 10px; background: linear-gradient(160deg, #FFE3EA 0%, #E9F7F3 100%); overflow: hidden; }
  .stage .bubble { position: absolute; left: 18px; right: 18px; top: 22px; background: rgba(255,255,255,0.92); border-radius: 16px; padding: 10px 12px; font-size: 13px; line-height: 1.35; box-shadow: 0 8px 18px rgba(16,22,28,0.08); }
  .bubble strong { color: var(--brand); }
  .pet-area { display: grid; place-items: center; padding: 54px 0 4px; }
  .pet { width: 220px; height: 180px; animation: float 3.4s ease-in-out infinite; cursor: pointer; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .gill { transform-origin: center; animation: wiggle 2.6s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(6deg); } }
  .sleeping .eye { display: none; }
  .sleeping .sleep-line { display: block; }
  .sleep-line { display: none; }
  .name-row { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 0 10px; }
  .name { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .level { font-size: 11px; font-weight: 700; color: #0E7C66; background: #D7F1E9; border-radius: 999px; padding: 4px 9px; }
  .stats { margin-top: 14px; display: grid; gap: 10px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .stat-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .stat-head span:last-child { color: var(--muted); font-weight: 500; }
  .bar { height: 8px; border-radius: 999px; background: #EEF1F7; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; transition: width 0.35s ease; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .action { border: 1px solid var(--line); background: #fff; border-radius: 18px; padding: 14px 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--ink); }
  .action:active { transform: scale(0.98); }
  .action span.emoji { font-size: 20px; }
  .xp { margin-top: 16px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
  .xp .row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .foot { text-align: center; color: var(--muted); font-size: 11px; margin-top: 14px; }
  .foot button { border: 0; background: transparent; color: var(--muted); text-decoration: underline; font-size: 11px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; background: #10161C; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 12px; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> Axolote</div>
  <button class="ghost" onclick="Nahua.close()">Cerrar</button>
</header>
<main>
  <div class="stage">
    <div class="bubble" id="bubble">¡Hola! Soy <strong>Xolito</strong>. Cuídame y te cuento secretos del lago.</div>
    <div class="pet-area" id="petArea">
      <svg class="pet" id="pet" viewBox="0 0 220 180" role="img" aria-label="Axolote">
        <ellipse cx="110" cy="150" rx="52" ry="9" fill="rgba(16,22,28,0.08)"/>
        <path d="M158 112 C 186 104, 196 86, 186 70 C 178 88, 168 94, 152 98 Z" fill="#FF9EB8"/>
        <ellipse cx="108" cy="110" rx="62" ry="40" fill="#FFB3C7"/>
        <ellipse cx="108" cy="122" rx="40" ry="22" fill="#FFD3DF"/>
        <g class="gill">
          <ellipse cx="52" cy="82" rx="9" ry="18" fill="#FF8FAE" transform="rotate(-28 52 82)"/>
          <ellipse cx="46" cy="100" rx="9" ry="17" fill="#FF8FAE" transform="rotate(-12 46 100)"/>
          <ellipse cx="52" cy="118" rx="8" ry="15" fill="#FF8FAE" transform="rotate(8 52 118)"/>
        </g>
        <g class="gill">
          <ellipse cx="168" cy="82" rx="9" ry="18" fill="#FF8FAE" transform="rotate(28 168 82)"/>
          <ellipse cx="174" cy="100" rx="9" ry="17" fill="#FF8FAE" transform="rotate(12 174 100)"/>
          <ellipse cx="168" cy="118" rx="8" ry="15" fill="#FF8FAE" transform="rotate(-8 168 118)"/>
        </g>
        <ellipse cx="108" cy="72" rx="44" ry="34" fill="#FFC2D2"/>
        <circle cx="92" cy="68" r="5" fill="#3A2430"/>
        <circle cx="124" cy="68" r="5" fill="#3A2430"/>
        <path class="sleep-line" d="M86 68 Q 92 72 98 68" stroke="#3A2430" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path class="sleep-line" d="M118 68 Q 124 72 130 68" stroke="#3A2430" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="85" cy="80" r="7" fill="#FF8FAE" opacity="0.45"/>
        <circle cx="131" cy="80" r="7" fill="#FF8FAE" opacity="0.45"/>
        <path id="mouth" d="M100 84 Q 108 92 116 84" stroke="#A8435F" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="name-row">
      <span class="name" id="petName">Xolito</span>
      <span class="level" id="petLevel">Cría · Nv. 1</span>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="actions">
    <button class="action" data-action="feed"><span class="emoji">🍤</span> Alimentar</button>
    <button class="action" data-action="play"><span class="emoji">🫧</span> Jugar</button>
    <button class="action" data-action="sleep"><span class="emoji">🌙</span> Dormir</button>
    <button class="action" data-action="bath"><span class="emoji">🛁</span> Bañar</button>
  </div>

  <div class="xp">
    <div class="row"><span>Experiencia</span><span id="xpText">0 / 40</span></div>
    <div class="bar"><i id="xpBar" style="width:0%;background:#FF8FAE"></i></div>
  </div>

  <div class="foot">
    Se guarda en este dispositivo · <button id="reset">empezar de nuevo</button>
  </div>
  <div class="toast" id="toast"></div>
</main>

<script src="../nahua-sdk.js"></script>
<script>
  var KEY = 'nahua.axolote.v1';
  var STAGES = ['Cría', 'Explorador', 'Juvenil', 'Guardián', 'Espíritu del lago'];
  var DECAY_PER_HOUR = { food: 9, mood: 7, energy: 5, clean: 4 };
  var LABELS = [
    { key: 'food', label: 'Comida', color: '#F2A100' },
    { key: 'mood', label: 'Ánimo', color: '#FF6B4A' },
    { key: 'energy', label: 'Energía', color: '#2F6BFF' },
    { key: 'clean', label: 'Limpieza', color: '#0E7C66' }
  ];
  var MESSAGES = {
    feed: ['¡Ñam! Las larvas del lago son mi favorito.', 'Gracias, ya tenía hambre.'],
    play: ['¡Burbujas! Otra vez, otra vez.', 'Me encanta jugar contigo.'],
    sleep: ['Zzz… cinco minutos más.', 'Soñé con canales de agua turquesa.'],
    bath: ['¡Agua fresca! Ahora brillo.', 'Sí que hacía falta.'],
    pet: ['Tu mano me da calma.', '¡Qué cosquillas!']
  };

  var state = load();
  var toastTimer = null;

  function defaults() {
    return { name: 'Xolito', food: 80, mood: 80, energy: 80, clean: 80, xp: 0, lastSeen: Date.now() };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return defaults();
      var parsed = JSON.parse(raw);
      return applyDecay(parsed);
    } catch (error) {
      return defaults();
    }
  }

  function applyDecay(value) {
    var hours = Math.max(0, (Date.now() - (value.lastSeen || Date.now())) / 3600000);
    var decayed = Object.assign(defaults(), value);
    if (hours > 0.02) {
      Object.keys(DECAY_PER_HOUR).forEach(function (key) {
        decayed[key] = clamp(decayed[key] - DECAY_PER_HOUR[key] * hours);
      });
    }
    decayed.lastSeen = Date.now();
    return decayed;
  }

  function clamp(value) { return Math.max(0, Math.min(100, Math.round(value))); }

  function xpForNextLevel() { return 40; }

  function level() { return Math.min(5, 1 + Math.floor(state.xp / xpForNextLevel())); }

  function save() {
    state.lastSeen = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (error) { /* storage full */ }
  }

  function showToast(text) {
    var toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function say(text) {
    document.getElementById('bubble').textContent = text;
  }

  function renderStats() {
    var container = document.getElementById('stats');
    container.innerHTML = LABELS.map(function (item) {
      var value = state[item.key];
      return '<div class="stat">' +
        '<div class="stat-head"><span>' + item.label + '</span><span>' + value + '%</span></div>' +
        '<div class="bar"><i style="width:' + value + '%;background:' + item.color + '"></i></div>' +
        '</div>';
    }).join('');
  }

  function renderLevel() {
    var stage = STAGES[level() - 1];
    document.getElementById('petLevel').textContent = stage + ' · Nv. ' + level();
    var progress = Math.min(100, Math.round((state.xp % xpForNextLevel()) / xpForNextLevel() * 100));
    document.getElementById('xpBar').style.width = progress + '%';
    document.getElementById('xpText').textContent = (state.xp % xpForNextLevel()) + ' / ' + xpForNextLevel();
  }

  function renderPet() {
    var happy = (state.mood + state.food) / 2;
    var mouth = document.getElementById('mouth');
    var pet = document.getElementById('pet');
    if (state.energy < 25) {
      pet.classList.add('sleeping');
      mouth.setAttribute('d', 'M100 86 Q 108 82 116 86');
    } else {
      pet.classList.remove('sleeping');
      mouth.setAttribute('d', happy < 40 ? 'M100 90 Q 108 82 116 90' : 'M100 84 Q 108 92 116 84');
    }
  }

  function render() {
    renderStats();
    renderLevel();
    renderPet();
    document.getElementById('petName').textContent = state.name;
  }

  function act(type) {
    var message = MESSAGES[type][Math.floor(Math.random() * MESSAGES[type].length)];
    if (type === 'feed') { state.food = clamp(state.food + 24); state.clean = clamp(state.clean - 4); }
    if (type === 'play') { state.mood = clamp(state.mood + 20); state.energy = clamp(state.energy - 10); state.food = clamp(state.food - 5); }
    if (type === 'sleep') { state.energy = clamp(state.energy + 30); state.mood = clamp(state.mood + 4); }
    if (type === 'bath') { state.clean = clamp(state.clean + 34); state.mood = clamp(state.mood + 6); }
    if (type === 'pet') { state.mood = clamp(state.mood + 5); }

    state.xp += type === 'pet' ? 2 : 6;

    var before = level();
    save();
    render();
    say(message);
    if (level() > before) {
      showToast('¡Subiste a ' + STAGES[level() - 1] + '!');
      state.xp += 10;
      save();
    }
  }

  document.querySelectorAll('[data-action]').forEach(function (button) {
    button.onclick = function () { act(button.getAttribute('data-action')); };
  });

  document.getElementById('pet').onclick = function () { act('pet'); };

  document.getElementById('reset').onclick = function () {
    state = defaults();
    save();
    render();
    say('Empezamos de nuevo. ¡Hola otra vez!');
    showToast('Axolote reiniciado');
  };

  document.querySelectorAll('[data-action="sleep"]').forEach(function (button) {
    button.addEventListener('click', function () {
      var pet = document.getElementById('pet');
      pet.classList.add('sleeping');
      setTimeout(function () { renderPet(); }, 1600);
    });
  });

  setInterval(function () {
    state = applyDecay(state);
    save();
    render();
  }, 60000);

  render();
  if (Nahua && Nahua.user().name) {
    say('Hola ' + Nahua.user().name.split(' ')[0] + '. Soy ' + state.name + ', tu axolote.');
  }
</script>
</body>
</html>
