<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nahua Food</title>
<style>
  :root { color-scheme: light; --brand: #F2A100; --ink: #10161C; --muted: #5D6A78; --line: #E4E8F0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #F5F6FA; color: var(--ink); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
  .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
  .ghost { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 8px; }
  main { padding: 4px 20px 120px; }
  h1 { font-size: 24px; margin: 8px 0 4px; letter-spacing: -0.4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
  .row + .row { border-top: 1px solid #F0F2F7; }
  .row strong { font-size: 15px; }
  .muted { color: var(--muted); font-size: 13px; }
  .price { font-weight: 700; font-size: 15px; }
  .add { border: 1px solid var(--line); background: #fff; border-radius: 12px; width: 34px; height: 34px; font-size: 18px; font-weight: 600; color: var(--brand); }
  .add:active { transform: scale(0.96); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .total-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(16,22,28,0.06); }
  .total-bar .line { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
  .total-bar strong { font-size: 20px; }
  button.primary { width: 100%; border: 0; border-radius: 16px; padding: 15px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 700; }
  button.primary:disabled { opacity: 0.45; }
  .success { text-align: center; padding: 28px 8px; }
  .success .check { width: 64px; height: 64px; border-radius: 50%; background: #E7F7F1; color: #0E7C66; display: grid; place-items: center; font-size: 30px; margin: 0 auto 14px; }
  .success h2 { margin: 0 0 6px; font-size: 22px; }
  .success p { color: var(--muted); font-size: 14px; margin: 4px 0; }
  .error { color: #C2410C; font-size: 13px; margin-top: 10px; text-align: center; }
  .bill { display: flex; align-items: center; gap: 14px; }
  .bill .icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; background: #EEF2FF; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> Nahua Food</div>
  <button class="ghost" onclick="Nahua.close()">Cerrar</button>
</header>
<main id="app">
  <h1>Cocina de Doña Meche</h1>
  <p class="sub">Comida casera · 25–35 min · Envío gratis hoy</p>

  <div class="card" id="menu"></div>
  <div class="error" id="error"></div>
</main>

<div class="total-bar" id="bar">
  <div class="line"><span id="cartLabel">Tu carrito está vacío</span><strong id="total">$0.00</strong></div>
  <button class="primary" id="checkout" disabled>Pagar con Nahua Wallet</button>
</div>

<script src="../nahua-sdk.js"></script>
<script>
  var MENU = [
    { id: 'tamales', name: 'Tamales verdes', detail: 'Pollo, salsa verde y crema', price: 78 },
    { id: 'pozole', name: 'Pozole rojo', detail: 'Con tostadas y orégano', price: 95 },
    { id: 'tacos', name: 'Tacos de canasta', detail: 'Orden de 4, papa y chicharrón', price: 55 },
    { id: 'agua', name: 'Agua de horchata', detail: '1 litro, hecha en casa', price: 32 }
  ];

  var cart = {};
  var paying = false;

  function money(value) { return '$' + value.toFixed(2); }

  function total() {
    return Object.keys(cart).reduce(function (sum, id) {
      var item = MENU.filter(function (entry) { return entry.id === id; })[0];
      return sum + (item ? item.price * cart[id] : 0);
    }, 0);
  }

  function render() {
    var menu = document.getElementById('menu');
    menu.innerHTML = '';
    MENU.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<div><strong>' + item.name + '</strong><div class="muted">' + item.detail + '</div></div>' +
        '<div style="display:flex;align-items:center;gap:10px">' +
        '<span class="price">' + money(item.price) + '</span>' +
        '<button class="add" data-id="' + item.id + '">+</button>' +
        '</div>';
      menu.appendChild(row);
    });

    menu.querySelectorAll('.add').forEach(function (button) {
      button.onclick = function () { add(button.getAttribute('data-id')); };
    });

    var count = Object.keys(cart).reduce(function (sum, id) { return sum + cart[id]; }, 0);
    var value = total();
    document.getElementById('total').textContent = money(value);
    document.getElementById('cartLabel').textContent = count === 0
      ? 'Tu carrito está vacío'
      : count + (count === 1 ? ' artículo' : ' artículos') + ' · envío gratis';
    document.getElementById('checkout').disabled = count === 0;
  }

  function add(id) {
    cart[id] = (cart[id] || 0) + 1;
    render();
  }

  function showSuccess(result, amount) {
    document.getElementById('bar').style.display = 'none';
    document.getElementById('app').innerHTML =
      '<div class="success">' +
      '<div class="check">✓</div>' +
      '<h2>Pedido en camino</h2>' +
      '<p>Doña Meche ya está cocinando. Llega en 25–35 min.</p>' +
      '<p><strong>' + money(amount) + '</strong> pagados con Nahua Wallet</p>' +
      '<p style="font-size:12px;color:#9AA7B6">ID ' + result.transactionId + '</p>' +
      '<button class="primary" style="margin-top:18px" onclick="Nahua.close()">Listo</button>' +
      '</div>';
  }

  document.getElementById('checkout').onclick = function () {
    if (paying) return;
    var amount = total();
    if (amount <= 0) return;
    paying = true;
    var button = document.getElementById('checkout');
    button.disabled = true;
    button.textContent = 'Confirmando…';
    Nahua.pay({
      amount: amount,
      concept: 'Pedido a domicilio',
      merchant: 'Cocina de Doña Meche'
    }).then(function (result) {
      showSuccess(result, amount);
    }).catch(function (error) {
      paying = false;
      button.disabled = false;
      button.textContent = 'Pagar con Nahua Wallet';
      var messages = {
        insufficient_funds: 'Saldo insuficiente. Recarga tu cartera.',
        cancelled: 'Pago cancelado.',
        invalid_amount: 'Monto inválido.'
      };
      document.getElementById('error').textContent = messages[error.error] || 'No pudimos completar el pago.';
    });
  };

  var user = Nahua.user();
  if (user.name) {
    document.querySelector('.sub').textContent = 'Hola ' + user.name.split(' ')[0] + ' · 25–35 min · envío gratis hoy';
  }
  render();
</script>
</body>
</html>
