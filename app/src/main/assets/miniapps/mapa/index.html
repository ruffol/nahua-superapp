<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapas de Colima</title>
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #3B2412; background: #EFE3CC; overflow: hidden; }
  #map { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; background: #E8EDF4; }
  .top { position: absolute; z-index: 10; top: 0; left: 0; right: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 0; }
  .card { background: rgba(58,33,23,0.94); border: 1.5px solid rgba(201,139,75,0.85); backdrop-filter: blur(12px); border-radius: 18px; box-shadow: 0 8px 24px rgba(15,8,5,0.35); }
  .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .brand { font-weight: 700; font-size: 15px; flex: 1; color: #F7E9CF; letter-spacing: 0.2px; }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: #CBB08C; margin-top: 1px; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: #2A1508; background: #E9B54F; border-radius: 6px; padding: 4px 8px; }
  .close { border: 1.5px solid rgba(201,139,75,0.75); background: #5A3524; color: #F7E9CF; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .cities { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; }
  .cities::-webkit-scrollbar { display: none; }
  .city { border: 1.5px solid rgba(201,139,75,0.65); background: rgba(90,53,36,0.92); border-radius: 6px; padding: 7px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; color: #F7E9CF; cursor: pointer; }
  .city.active { background: #D79A45; border-color: #D79A45; color: #2A1508; }
  .bottom { position: absolute; z-index: 10; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); }
  .sheet { padding: 12px 14px; max-height: 38vh; overflow-y: auto; color: #F7E9CF; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .row + .row { border-top: 1px solid rgba(201,139,75,0.28); }
  .pin { width: 36px; height: 36px; border-radius: 6px; background: rgba(215,154,69,0.22); display: grid; place-items: center; font-size: 17px; flex: none; }
  .row strong { font-size: 13px; display: block; color: #F7E9CF; }
  .row span { font-size: 11px; color: #CBB08C; }
  .go { margin-left: auto; border: 0; background: #D79A45; color: #2A1508; border-radius: 5px; padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .locate { position: absolute; right: 14px; z-index: 11; bottom: calc(42vh + 12px + env(safe-area-inset-bottom)); width: 48px; height: 48px; border-radius: 6px; border: 2px solid rgba(201,139,75,0.9); background: #D79A45; color: #2A1508; box-shadow: 0 6px 18px rgba(15,8,5,0.35); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .locate:active { transform: scale(0.94); }
  .note { margin: 6px 2px 0; font-size: 10px; color: #CBB08C; text-align: center; }
  .leaflet-control-attribution { font-size: 9px; background: rgba(58,33,23,0.82); color: #E9D6B4; padding: 2px 6px; border-radius: 4px 0 0 0; }
  .leaflet-control-attribution a { color: #F0C05A; }
  .user-dot { width: 16px; height: 16px; border-radius: 50%; background: #B5643F; border: 3px solid #FFF3DE; box-shadow: 0 0 0 6px rgba(181,100,63,0.28); }

  /* Modo compacto para la pantalla principal (HomeScreen) */
  body.compact-mode .top .head .brand small { display: none; }
  body.compact-mode .top .head .close { display: none; }
  body.compact-mode .bottom .sheet { display: none; }
  body.compact-mode .bottom .note { display: none; }
  body.compact-mode .locate { bottom: 40px; right: 12px; width: 42px; height: 42px; font-size: 18px; }
  body.compact-mode .top { padding-top: 8px; }
  body.compact-mode .card { background: rgba(58,33,23,0.92); }
  body.compact-mode .head { padding: 7px 10px; }
  body.compact-mode .brand { font-size: 13px; }
  body.compact-mode .badge { font-size: 9px; padding: 3px 6px; }
  body.compact-mode .cities { padding: 0 8px 8px; gap: 6px; }
  body.compact-mode .city { padding: 5px 9px; font-size: 11px; }
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="card">
    <div class="head">
      <div class="brand">Colima<small id="cityLabel">Mapa offline · tianguis y GPS</small></div>
      <span class="badge">OFFLINE</span>
      <button class="close" onclick="Nahua.close()">Cerrar</button>
    </div>
    <div class="cities" id="cities"></div>
  </div>
</div>

<button class="locate" id="locate" title="Mi ubicación">📍</button>

<div class="bottom">
  <div class="card sheet" id="sheet"></div>
  <div class="note">© OpenStreetMap · teselas de Colima empaquetadas offline</div>
</div>

<script src="../vendor/leaflet/leaflet.js"></script>
<script src="../nahua-sdk.js"></script>
<script>
  var isCompact = window.location.search.indexOf('mode=compact') !== -1;
  if (isCompact) {
    document.body.classList.add('compact-mode');
  }

  var MUNICIPIOS = [
    { id: 'colima', label: 'Colima', center: [19.2433, -103.7250], zoom: 14 },
    { id: 'villa', label: 'Villa de Álvarez', center: [19.2670, -103.7370], zoom: 14 },
    { id: 'comala', label: 'Comala', center: [19.3270, -103.7590], zoom: 14 },
    { id: 'tecoman', label: 'Tecomán', center: [18.9100, -103.8730], zoom: 13 },
    { id: 'manzanillo', label: 'Manzanillo', center: [19.0510, -104.3150], zoom: 13 },
    { id: 'armeria', label: 'Armería', center: [18.9370, -103.9640], zoom: 13 }
  ];

  var TIANGUIS = [
    { city: 'colima', name: 'Mercado Gutiérrez Nájera', area: 'Centro', day: 'Diario · 6:00–18:00', specialty: 'Frutas, carnes y comida corrida', lat: 19.2446, lng: -103.7240, emoji: '🧺' },
    { city: 'colima', name: 'Tianguis La Estancia', area: 'La Estancia', day: 'Domingo · 7:00–14:00', specialty: 'Verduras y antojitos', lat: 19.2560, lng: -103.7180, emoji: '🥬' },
    { city: 'colima', name: 'Tianguis Vista Hermosa', area: 'Vista Hermosa', day: 'Miércoles · 7:00–13:00', specialty: 'Ropa, fruta y plantas', lat: 19.2710, lng: -103.7350, emoji: '👕' },
    { city: 'villa', name: 'Tianguis de Villa de Álvarez', area: 'Centro', day: 'Domingo · 7:00–15:00', specialty: 'Tamales, tuba y quesos', lat: 19.2668, lng: -103.7385, emoji: '🫔' },
    { city: 'villa', name: 'Mercado Campesino', area: 'La Fábrica', day: 'Sábado · 8:00–14:00', specialty: 'Producto local de temporada', lat: 19.2600, lng: -103.7450, emoji: '🌽' },
    { city: 'comala', name: 'Mercado de Comala', area: 'Centro', day: 'Diario · 7:00–19:00', specialty: 'Café, pan y nieves de garrafa', lat: 19.3273, lng: -103.7592, emoji: '☕' },
    { city: 'comala', name: 'Tianguis de Suchitlán', area: 'Suchitlán', day: 'Domingo · 8:00–14:00', specialty: 'Café de altura y artesanías', lat: 19.3750, lng: -103.7100, emoji: '🎨' },
    { city: 'tecoman', name: 'Mercado Municipal', area: 'Centro', day: 'Diario · 6:00–17:00', specialty: 'Limón, mango y mariscos', lat: 18.9103, lng: -103.8728, emoji: '🍋' },
    { city: 'tecoman', name: 'Tianguis de Cerro de Ortega', area: 'Cerro de Ortega', day: 'Jueves · 7:00–14:00', specialty: 'Coco y pescado fresco', lat: 18.7500, lng: -103.8000, emoji: '🥥' },
    { city: 'manzanillo', name: 'Mercado de Manzanillo', area: 'Centro', day: 'Diario · 6:00–17:00', specialty: 'Pescado y mariscos del día', lat: 19.0512, lng: -104.3148, emoji: '🐟' },
    { city: 'manzanillo', name: 'Tianguis de Santiago', area: 'Santiago', day: 'Sábado · 7:00–14:00', specialty: 'Frutas y mariscos', lat: 19.1100, lng: -104.3400, emoji: '🦐' },
    { city: 'armeria', name: 'Tianguis de Armería', area: 'Centro', day: 'Martes · 7:00–14:00', specialty: 'Sandía, melón y mango', lat: 18.9372, lng: -103.9638, emoji: '🍉' }
  ];

  var BOUNDS = L.latLngBounds([18.55, -104.85], [19.50, -103.30]);
  var OFFLINE_TILE = 'tiles/{z}/{x}/{y}.png';
  var TRANSPARENT = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';

  var map = L.map('map', {
    zoomControl: false,
    minZoom: 9,
    maxZoom: 18,
    maxBounds: BOUNDS,
    maxBoundsViscosity: 0.9
  }).setView([19.2433, -103.7250], isCompact ? 13 : 13);

  // Capa offline principal
  var offline = L.tileLayer(OFFLINE_TILE, {
    minZoom: 9,
    maxNativeZoom: 13,
    maxZoom: 18,
    errorTileUrl: TRANSPARENT,
    keepBuffer: 6,
    attribution: 'Colima offline'
  }).addTo(map);

  // Sin capa online: la app es offline y no debe golpear los servidores públicos de OSM
  // (su política de uso bloquea las apps que consumen teselas en bloque).

  L.control.scale({ imperial: false }).addTo(map);

  var layer = L.layerGroup().addTo(map);
  var current = MUNICIPIOS[0];
  var markers = {};
  var userMarker = null;
  var userCircle = null;

  function icon(market, active) {
    var size = active ? 42 : 36;
    var background = active ? '#D79A45' : '#F7E9CF';
    var border = active ? '#B5643F' : '#C98B4B';
    var html = '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:5px;display:grid;' +
      'place-items:center;font-size:' + (active ? 19 : 16) + 'px;background:' + background + ';' +
      'box-shadow:0 3px 0 rgba(15,8,5,0.35);border:2px solid ' + border + ';">' +
      market.emoji + '</div>';
    return L.divIcon({ className: '', html: html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
  }

  function renderCities() {
    var container = document.getElementById('cities');
    if (!container) return;
    container.innerHTML = '';
    MUNICIPIOS.forEach(function (city) {
      var button = document.createElement('button');
      button.className = 'city' + (city.id === current.id ? ' active' : '');
      button.textContent = city.label;
      button.onclick = function () { selectCity(city); };
      container.appendChild(button);
    });
    var label = document.getElementById('cityLabel');
    if (label) {
      label.textContent = current.label + ' · ' + TIANGUIS.filter(function (m) { return m.city === current.id; }).length + ' tianguis';
    }
  }

  function renderSheet() {
    var sheet = document.getElementById('sheet');
    if (!sheet) return;
    var markets = TIANGUIS.filter(function (m) { return m.city === current.id; });
    var html = '<div class="section-title" style="font-size:11px;font-weight:700;color:#5D6A78;margin-bottom:6px;">TIANGUIS EN ' + current.label.toUpperCase() + '</div>';
    markets.forEach(function (market) {
      html += '<div class="row" data-market="' + market.name + '">' +
        '<div class="pin">' + market.emoji + '</div>' +
        '<div style="flex:1;"><strong>' + market.name + '</strong><span>' + market.area + ' · ' + market.specialty +
        '</span><br><span>' + market.day + '</span></div>' +
        '<button class="go" data-go="' + market.name + '">Ver</button>' +
        '</div>';
    });
    sheet.innerHTML = html;

    sheet.querySelectorAll('[data-go]').forEach(function (button) {
      button.onclick = function (event) {
        event.stopPropagation();
        focusMarket(button.getAttribute('data-go'));
      };
    });
    sheet.querySelectorAll('[data-market]').forEach(function (row) {
      row.onclick = function () { focusMarket(row.getAttribute('data-market')); };
    });
  }

  function selectCity(city) {
    current = city;
    map.setView(city.center, city.zoom, { animate: true });
    renderCities();
    renderSheet();
    drawMarkers();
  }

  function drawMarkers() {
    layer.clearLayers();
    markers = {};
    TIANGUIS.filter(function (m) { return m.city === current.id; }).forEach(function (market) {
      var marker = L.marker([market.lat, market.lng], { icon: icon(market, false) }).addTo(layer);
      marker.bindPopup('<strong>' + market.name + '</strong><br>' + market.specialty +
        '<br><span style="color:#5D6A78">' + market.day + '</span>');
      marker.on('click', function () {
        marker.openPopup();
        Nahua.toast(market.name + ' · ' + market.area);
      });
      markers[market.name] = marker;
    });
  }

  function focusMarket(name) {
    var market = TIANGUIS.filter(function (m) { return m.name === name; })[0];
    if (!market) return;
    map.flyTo([market.lat, market.lng], 16, { duration: 0.7 });
    var marker = markers[market.name];
    if (marker) { marker.setIcon(icon(market, true)); marker.openPopup(); }
    setTimeout(function () { if (marker) marker.setIcon(icon(market, false)); }, 2200);
  }

  function locateUser() {
    Nahua.location().then(function (fix) {
      var latlng = [fix.lat, fix.lng];
      map.flyTo(latlng, 15, { duration: 0.8 });
      if (userMarker) map.removeLayer(userMarker);
      if (userCircle) map.removeLayer(userCircle);
      userMarker = L.marker(latlng, {
        icon: L.divIcon({
          className: '',
          html: '<div class="user-dot"></div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        })
      }).addTo(map);
      userCircle = L.circle(latlng, {
        radius: Math.max(25, fix.accuracy || 35),
        color: '#2F6BFF',
        weight: 2,
        fillColor: '#2F6BFF',
        fillOpacity: 0.15
      }).addTo(map);
      Nahua.toast('Estás aquí · ' + fix.lat.toFixed(4) + ', ' + fix.lng.toFixed(4));
    }).catch(function (error) {
      // Si la ubicación no está disponible, centrar en Colima Centro amigablemente
      map.flyTo([19.2433, -103.7250], 14, { duration: 0.8 });
      Nahua.toast('Colima Centro · ' + (error.error === 'permission_denied' ? 'Permite ubicación para GPS en vivo' : 'Centrado en Colima'));
    });
  }

  document.getElementById('locate').onclick = locateUser;

  function triggerResize() {
    if (map) {
      map.invalidateSize();
    }
  }

  window.addEventListener('load', triggerResize);
  window.addEventListener('resize', triggerResize);
  setTimeout(triggerResize, 100);
  setTimeout(triggerResize, 400);
  setTimeout(triggerResize, 1200);

  renderCities();
  renderSheet();
  drawMarkers();
</script>
</body>
</html>
