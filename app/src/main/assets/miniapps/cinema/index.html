<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cine</title>
<style>
  :root { color-scheme: light; --brand: #7C4DFF; --ink: #10161C; --muted: #5D6A78; --line: #E4E8F0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #F5F6FA; color: var(--ink); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
  .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
  .ghost { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 8px; }
  main { padding: 4px 20px 120px; }
  h1 { font-size: 24px; margin: 8px 0 4px; letter-spacing: -0.4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
  .row + .row { border-top: 1px solid #F0F2F7; }
  .row strong { font-size: 15px; }
  .muted { color: var(--muted); font-size: 13px; }
  .price { font-weight: 700; font-size: 15px; }
  .add { border: 1px solid var(--line); background: #fff; border-radius: 12px; width: 34px; height: 34px; font-size: 18px; font-weight: 600; color: var(--brand); }
  .add:active { transform: scale(0.96); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .total-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(16,22,28,0.06); }
  .total-bar .line { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
  .total-bar strong { font-size: 20px; }
  button.primary { width: 100%; border: 0; border-radius: 16px; padding: 15px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 700; }
  button.primary:disabled { opacity: 0.45; }
  .success { text-align: center; padding: 28px 8px; }
  .success .check { width: 64px; height: 64px; border-radius: 50%; background: #E7F7F1; color: #0E7C66; display: grid; place-items: center; font-size: 30px; margin: 0 auto 14px; }
  .success h2 { margin: 0 0 6px; font-size: 22px; }
  .success p { color: var(--muted); font-size: 14px; margin: 4px 0; }
  .error { color: #C2410C; font-size: 13px; margin-top: 10px; text-align: center; }
  .bill { display: flex; align-items: center; gap: 14px; }
  .bill .icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; background: #EEF2FF; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> Cine</div>
  <button class="ghost" onclick="Nahua.close()">Cerrar</button>
</header>
<main id="app">
  <h1>Cartelera Nahua</h1>
  <p class="sub">Sala 4 · Plaza Central · hoy</p>

  <div class="tabs" id="tabs"></div>
  <div class="card" id="movieCard"></div>

  <div class="card">
    <div class="row" style="padding-top:0">
      <span>Boletos</span>
      <span style="display:flex;align-items:center;gap:12px">
        <button class="add" id="minus">−</button>
        <strong id="count">1</strong>
        <button class="add" id="plus">+</button>
      </span>
    </div>
    <div class="row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
    <div class="row"><span>Cargo por servicio</span><strong id="fee">$12.00</strong></div>
    <div class="row"><span>Total</span><strong id="total" style="font-size:20px">$0.00</strong></div>
  </div>

  <button class="primary" id="buy">Comprar boletos</button>
  <div class="error" id="error"></div>
</main>

<script src="../nahua-sdk.js"></script>
<script>
  var MOVIES = [
    { id: 'luz', title: 'La luz de Oaxaca', genre: 'Drama · 1h 48m', showtimes: ['16:30', '19:00', '21:15'], price: 89 },
    { id: 'norte', title: 'Norte salvaje', genre: 'Aventura · 2h 06m', showtimes: ['15:45', '18:20', '20:50'], price: 95 },
    { id: 'risa', title: 'Risa de barrio', genre: 'Comedia · 1h 35m', showtimes: ['17:10', '19:40'], price: 79 }
  ];

  var movie = MOVIES[0];
  var showtime = movie.showtimes[1];
  var count = 1;
  var paying = false;

  function money(value) { return '$' + value.toFixed(2); }

  function fee() { return 12; }

  function renderTabs() {
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    MOVIES.forEach(function (entry) {
      var button = document.createElement('button');
      button.className = 'tab' + (entry.id === movie.id ? ' active' : '');
      button.textContent = entry.title.split(' ')[0];
      button.onclick = function () {
        movie = entry;
        showtime = entry.showtimes[0];
        render();
      };
      tabs.appendChild(button);
    });
  }

  function render() {
    renderTabs();
    var card = document.getElementById('movieCard');
    card.innerHTML =
      '<strong style="font-size:18px">' + movie.title + '</strong>' +
      '<div class="muted" style="margin:4px 0 14px">' + movie.genre + '</div>' +
      '<div class="label" style="margin-bottom:8px">Funciones</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      movie.showtimes.map(function (time) {
        return '<button class="tab' + (time === showtime ? ' active' : '') + '" style="flex:0 0 auto;padding:10px 16px" data-time="' + time + '">' + time + '</button>';
      }).join('') +
      '</div>';

    card.querySelectorAll('button[data-time]').forEach(function (button) {
      button.onclick = function () {
        showtime = button.getAttribute('data-time');
        render();
      };
    });

    updateTotals();
  }

  function updateTotals() {
    var subtotal = movie.price * count;
    document.getElementById('count').textContent = count;
    document.getElementById('subtotal').textContent = money(subtotal);
    document.getElementById('fee').textContent = money(fee());
    document.getElementById('total').textContent = money(subtotal + fee());
    document.getElementById('buy').textContent = 'Comprar ' + count + (count === 1 ? ' boleto' : ' boletos') + ' · ' + money(subtotal + fee());
    document.getElementById('error').textContent = '';
  }

  document.getElementById('plus').onclick = function () { count = Math.min(count + 1, 8); updateTotals(); };
  document.getElementById('minus').onclick = function () { count = Math.max(count - 1, 1); updateTotals(); };

  document.getElementById('buy').onclick = function () {
    if (paying) return;
    var amount = movie.price * count + fee();
    paying = true;
    var button = document.getElementById('buy');
    button.disabled = true;
    button.textContent = 'Confirmando…';
    Nahua.pay({
      amount: amount,
      concept: count + ' boleto(s) · ' + showtime,
      merchant: 'Cine Nahua'
    }).then(function (result) {
      document.getElementById('app').innerHTML =
        '<div class="success">' +
        '<div class="check">✓</div>' +
        '<h2>¡Disfruta la función!</h2>' +
        '<p>' + movie.title + ' · ' + showtime + '</p>' +
        '<p>' + count + ' boleto(s) · Sala 4</p>' +
        '<p><strong>' + money(amount) + '</strong> pagados con Nahua Wallet</p>' +
        '<p style="font-size:12px;color:#9AA7B6">ID ' + result.transactionId + '</p>' +
        '<button class="primary" style="margin-top:18px" onclick="Nahua.close()">Listo</button>' +
        '</div>';
    }).catch(function (error) {
      paying = false;
      button.disabled = false;
      updateTotals();
      var messages = {
        insufficient_funds: 'Saldo insuficiente. Recarga tu cartera.',
        cancelled: 'Compra cancelada.',
        invalid_amount: 'Monto inválido.'
      };
      document.getElementById('error').textContent = messages[error.error] || 'No pudimos completar la compra.';
    });
  };

  render();
</script>
</body>
</html>
